<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

    <!-- CSS -->
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <header class="header">
      <p class="logo">Sneaker store</p>
      <nav>
        <ul>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </header>
    <main class="content">
      <div>
        <h1>Pagina titel</h1>
      </div>
      <section>
        <h2>Grid</h2>
        <div class="grid">
          <article class="card">
            <!-- Imagick CLI resize commands
              magick paul-gaudriault-a-QH9MAAVNI-unsplash.jpg -resize 400x paul-gaudriault-a-QH9MAAVNI-unsplash-400.jpg
              magick paul-gaudriault-a-QH9MAAVNI-unsplash.jpg -resize 900x paul-gaudriault-a-QH9MAAVNI-unsplash-900.jpg
              magick paul-gaudriault-a-QH9MAAVNI-unsplash.jpg -resize 1400x paul-gaudriault-a-QH9MAAVNI-unsplash-1400.jpg
            -->
            <!-- Imagick CLI avif/webp commands
              magick paul-gaudriault-a-QH9MAAVNI-unsplash.jpg paul-gaudriault-a-QH9MAAVNI-unsplash.webp
              magick paul-gaudriault-a-QH9MAAVNI-unsplash.jpg paul-gaudriault-a-QH9MAAVNI-unsplash.avif
            -->

            <picture>
              <source media="(max-width: 50rem)" srcset="images/paul-gaudriault-a-QH9MAAVNI-unsplash.jpg" />
              <source media="(min-width: 50rem)" srcset="images/ryan-waring-164_6wVEHfI-unsplash.jpg" />
              <img src="images/paul-gaudriault-a-QH9MAAVNI-unsplash.jpg" alt="" />
            </picture>
            <h3 class="card__title">Card title</h3>
          </article>
          <article class="card">
            <img src="images/ryan-waring-164_6wVEHfI-unsplash.jpg" alt="" />
            <h3 class="card__title">Card title</h3>
          </article>
          <article class="card">
            <img src="images/usama-akram-kP6knT7tjn4-unsplash.jpg" alt="" />
            <h3 class="card__title">Card title</h3>
          </article>
        </div>
      </section>
    </main>
    <footer class="footer">
      <p>©Artevelde Hogeschool</p>
    </footer>
  </body>
</html>
